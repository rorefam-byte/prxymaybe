<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Proxy-Enabled HTML Web Browser</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background-color: #202124;
    }
    
    /* Navigation Bar Container */
    #navbar {
      display: flex;
      background-color: #35363a;
      padding: 8px;
      border-bottom: 1px solid #1f2023;
      align-items: center;
      gap: 6px;
    }
    
    /* Control Buttons */
    button {
      background-color: transparent;
      border: none;
      color: #e8eaed;
      padding: 6px 10px;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }
    button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    
    /* Smart Address Bar */
    #url-bar {
      flex-grow: 1;
      padding: 8px 12px;
      font-size: 14px;
      background-color: #202124;
      border: 1px solid #202124;
      color: #e8eaed;
      border-radius: 20px;
      outline: none;
      transition: border 0.2s;
    }
    #url-bar:focus {
      border: 1px solid #8ab4f8;
    }
    
    /* Webview Container */
    webview {
      flex-grow: 1;
      width: 100%;
      height: 100%;
      background-color: white;
    }
  </style>
</head>
<body>

  <!-- Top Browser Navigation Control Panel -->
  <div id="navbar">
    <button id="back-btn" title="Back">⬅️</button>
    <button id="forward-btn" title="Forward">➡️</button>
    <button id="reload-btn" title="Reload">🔄</button>
    <input type="text" id="url-bar" value="https://duckduckgo.com" placeholder="Type a URL or search query and press Enter...">
  </div>

  <!-- The Actual Native Embedded Browser Frame -->
  <webview id="web-view" src="https://duckduckgo.com"></webview>

  <!-- Front-End Action Script -->
  <script>
    const webview = document.getElementById('web-view');
    const urlBar = document.getElementById('url-bar');
    const backBtn = document.getElementById('back-btn');
    const forwardBtn = document.getElementById('forward-btn');
    const reloadBtn = document.getElementById('reload-btn');

    // Function to handle loading URLs and formatting them correctly
    function navigateToUrl() {
      let url = urlBar.value.trim();
      if (!url) return;

      // If it doesn't look like a URL, execute a DuckDuckGo search instead
      if (!url.includes('.') || url.includes(' ')) {
        url = `https://duckduckgo.com{encodeURIComponent(url)}`;
      } else if (!/^https?:\/\//i.test(url)) {
        // Automatically inject standard transfer protocol if missing
        url = 'https://' + url;
      }
      
      webview.loadURL(url);
    }

    // Trigger navigation when user presses the Enter key
    urlBar.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        navigateToUrl();
      }
    });

    // Handle Toolbar Actions
    backBtn.addEventListener('click', () => { if (webview.canGoBack()) webview.goBack(); });
    forwardBtn.addEventListener('click', () => { if (webview.canGoForward()) webview.goForward(); });
    reloadBtn.addEventListener('click', () => { webview.reload(); });

    // Synchronize UI elements (disabled states, address input text) during browsing
    webview.addEventListener('did-navigate', (e) => {
      urlBar.value = e.url;
      backBtn.disabled = !webview.canGoBack();
      forwardBtn.disabled = !webview.canGoForward();
    });

    webview.addEventListener('did-navigate-in-page', (e) => {
      urlBar.value = e.url;
    });
  </script>
</body>
</html>
